name: Check Odisha Postal Notices

on:
  schedule:
    # Every 5 min, 24h
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send latest PDF as test proof?'
        required: false
        default: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Debug connectivity
        run: |
          echo "=== runner ==="; curl -s --max-time 15 https://ipinfo.io/json || true
          echo "=== google (should work) ==="; curl -o /dev/null -s -w "google http:%{http_code} time:%{time_total}s\n" --max-time 20 https://www.google.com || true
          echo "=== DNS ==="; nslookup app.indiapost.gov.in || true
          echo "=== target ==="; curl -o /dev/null -s -w "target http:%{http_code} time:%{time_total}s\n" --max-time 40 -A "Mozilla/5.0" https://app.indiapost.gov.in/circleportal/odisha || echo "TARGET CURL FAILED exit=$?"

      - name: Check for new notices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ github.event.inputs.send_test || 'false' }}
        run: python checker.py

      - name: Persist state
        run: |
          git config user.name "notice-bot"
          git config user.email "notice-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update seen notices [skip ci]" && git push)
